spring.application.name=fundoo-notes

server.port=8085
logging.level.org.springframework.security=TRACE
spring.datasource.url=jdbc:mysql://localhost:3306/fundoo_notes
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

jwt.secret=my-super-secret-key-for-fundoo-notes-application
jwt.expiration-ms=86400000

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

spring.activemq.broker-url=vm://fundoo-reminder-broker?broker.persistent=false
spring.activemq.in-memory=true

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
